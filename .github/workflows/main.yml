name: Build HB Store Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          ZIP="$(find . -maxdepth 3 -iname 'HBStoreHubAndroid*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Zip file not found in repo"
            ls -R | head -100
            exit 1
          fi
          echo "Using: $ZIP"
          unzip -o "$ZIP" -d project
          PROJECT_DIR=$(find project -maxdepth 1 -type d -iname 'HBStoreHubAndroid*' | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Enable AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          touch gradle.properties
          grep -q "android.useAndroidX" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -q "android.enableJetifier" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties

      - name: Auto-bump version code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          GRADLE_FILE="app/build.gradle"
          if [ ! -f "$GRADLE_FILE" ]; then GRADLE_FILE="app/build.gradle.kts"; fi
          CURRENT_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' "$GRADLE_FILE" || echo 1)
          NEW_CODE=$((CURRENT_CODE + 1))
          sed -i "s/versionCode\s*[0-9]\+/versionCode $NEW_CODE/" "$GRADLE_FILE"
          echo "NEW_VERSION_CODE=$NEW_CODE" >> $GITHUB_ENV
          echo "Bumped versionCode to $NEW_CODE"

      - name: Decode keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-key.jks

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HBStoreHub-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release (for auto-update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION_CODE }}
          name: Release v${{ env.NEW_VERSION_CODE }}
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
