name: Release APK

on:
  push:
    tags:
      - 'v*-test'
      - 'v[0-9]*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (example: 69)'
        required: true
        type: string

      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - test
          - stable

      promote_tag:
        description: 'Promote existing test release (example: v69-test). Leave blank for new build.'
        required: false
        type: string


permissions:
  contents: write


jobs:

  # ============================================================
  # PROMOTE TEST RELEASE TO STABLE
  # ============================================================

  promote:
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.promote_tag != ''

    runs-on: ubuntu-latest

    steps:

      - name: Promote test release to stable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.promote_tag }}

        run: |

          echo "======================================"
          echo "Promoting release: $TAG"
          echo "======================================"

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease=false \
            --latest=true

          echo "======================================"
          echo "Release promoted successfully"
          echo "======================================"


  # ============================================================
  # BUILD AND RELEASE APK
  # ============================================================

  release:
    if: >
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.promote_tag == ''
      )

    runs-on: ubuntu-latest


    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # FIND AND EXTRACT ANDROID PROJECT ZIP
      # ========================================================

      - name: Extract Android project
        run: |

          echo "Searching for HBStoreHub Android ZIP..."

          ZIP="$(ls -t $(find . \
            -maxdepth 3 \
            -iname 'HBStoreHubAndroid*.zip' \
            -not -path './project/*' \
            2>/dev/null | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: HBStoreHubAndroid ZIP not found."

            echo "Repository files:"
            ls -R | head -200

            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP"

          rm -rf project

          unzip -o "$ZIP" -d project


          SETTINGS="$(find project \
            -maxdepth 5 \
            -name settings.gradle \
            -o -name settings.gradle.kts \
            | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."

            ls -R project | head -200

            exit 1
          fi


          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Android project:"
          echo "$PROJECT_DIR"
          echo "======================================"

          ls -la "$PROJECT_DIR"


      # ========================================================
      # JAVA 17
      # ========================================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ========================================================
      # ANDROID SDK
      # ========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # ========================================================
      # GRADLE
      # ========================================================

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ========================================================
      # GENERATE GRADLE WRAPPER
      # ========================================================

      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}

        run: |

          gradle wrapper --gradle-version 8.9

          chmod +x gradlew


      # ========================================================
      # ENABLE ANDROIDX
      # ========================================================

      - name: Enable AndroidX
        working-directory: ${{ env.PROJECT_DIR }}

        run: |

          touch gradle.properties

          grep -q "android.useAndroidX" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

          cat gradle.properties


      # ========================================================
      # DETERMINE VERSION
      # ========================================================

      - name: Set version
        working-directory: ${{ env.PROJECT_DIR }}

        run: |

          # ----------------------------------------------------
          # TAG BUILD
          # ----------------------------------------------------

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then

            TAG="${GITHUB_REF_NAME}"

          else

            VERSION="${{ inputs.version }}"
            TYPE="${{ inputs.release_type }}"

            if [ "$TYPE" = "test" ]; then

              TAG="v${VERSION}-test"

            else

              TAG="v${VERSION}"

            fi

          fi


          # ----------------------------------------------------
          # EXTRACT VERSION NUMBER
          # ----------------------------------------------------

          VERSION_CODE="${TAG#v}"
          VERSION_CODE="${VERSION_CODE%%-*}"

          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then

            echo "ERROR: Invalid version/tag:"
            echo "$TAG"

            exit 1

          fi


          VERSION_NAME="1.0.${VERSION_CODE}"


          # ----------------------------------------------------
          # DETERMINE RELEASE TYPE
          # ----------------------------------------------------

          if [[ "$TAG" == *"-test" ]]; then

            RELEASE_TYPE="test"

          else

            RELEASE_TYPE="stable"

          fi


          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TYPE=$RELEASE_TYPE" >> "$GITHUB_ENV"


          echo ""
          echo "======================================"
          echo "Release information"
          echo "======================================"
          echo "TAG          : $TAG"
          echo "VERSION CODE : $VERSION_CODE"
          echo "VERSION NAME : $VERSION_NAME"
          echo "TYPE         : $RELEASE_TYPE"
          echo "======================================"


          # ----------------------------------------------------
          # Update app/build.gradle
          # ----------------------------------------------------

          sed -i -E \
            "s/versionCode[ =]+[0-9]+/versionCode $VERSION_CODE/" \
            app/build.gradle


          sed -i -E \
            "s/versionName[ =]+'[^']+'/versionName '$VERSION_NAME'/" \
            app/build.gradle


          sed -i -E \
            "s/versionName[ =]+\"[^\"]+\"/versionName \"$VERSION_NAME\"/" \
            app/build.gradle


          echo ""
          echo "Final Android version:"
          grep -nE "versionCode|versionName" app/build.gradle


      # ========================================================
      # RESTORE OLD SIGNING KEY
      # ========================================================

      - name: Restore or generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |

          DEST="$PROJECT_DIR/app/release-key.jks"


          # ----------------------------------------------------
          # CHECK OLD KEY
          # ----------------------------------------------------

          if [ -f "hbstore-key.jks" ]; then

            echo "======================================"
            echo "Existing HB Store keystore found."
            echo "Reusing existing signing key."
            echo "======================================"

            cp hbstore-key.jks "$DEST"


          else

            echo "======================================"
            echo "HB Store keystore not found."
            echo "Generating new keystore."
            echo "======================================"


            if [ -z "$KEYSTORE_PASSWORD" ]; then

              echo "ERROR: KEYSTORE_PASSWORD secret is missing."

              exit 1

            fi


            if [ -z "$KEY_ALIAS" ]; then

              echo "ERROR: KEY_ALIAS secret is missing."

              exit 1

            fi


            keytool -genkeypair -v \
              -keystore "$DEST" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=HBStoreHub, OU=HBStoreHub, O=HBStoreHub, L=Kerala, S=Kerala, C=IN"


            cp "$DEST" hbstore-key.jks

          fi


          test -s "$DEST"

          echo "Keystore ready."


      # ========================================================
      # BUILD SIGNED APK
      # ========================================================

      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_DIR }}

        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |

          chmod +x gradlew

          ./gradlew clean assembleRelease --no-daemon


      # ========================================================
      # PREPARE APK
      # ========================================================

      - name: Prepare APK
        run: |

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" \
            HBStoreHub.apk


          ls -lh HBStoreHub.apk


      # ========================================================
      # SAVE KEYSTORE TO REPOSITORY
      # ========================================================

      - name: Commit keystore if newly generated
        run: |

          if [ -n "$(git status --porcelain hbstore-key.jks)" ]; then

            echo "New keystore detected."

            git config user.name "github-actions[bot]"

            git config user.email \
              "github-actions[bot]@users.noreply.github.com"


            git add hbstore-key.jks


            git commit \
              -m "Add HB Store release keystore"


            git push

          else

            echo "Existing keystore already available."

          fi


      # ========================================================
      # UPLOAD APK ARTIFACT
      # ========================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4

        with:
          name: HBStoreHub-APK-${{ env.TAG }}
          path: HBStoreHub.apk


      # ========================================================
      # CREATE GITHUB RELEASE
      # ========================================================

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          # ----------------------------------------------------
          # TEST RELEASE
          # ----------------------------------------------------

          if [ "$RELEASE_TYPE" = "test" ]; then

            echo "======================================"
            echo "Creating TEST release"
            echo "======================================"


            gh release create "$TAG" \
              HBStoreHub.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "HB Store Hub ${TAG} (TEST)" \
              --notes "Admin-only test release. Shops and storekeepers remain on the current stable version." \
              --prerelease


          # ----------------------------------------------------
          # STABLE RELEASE
          # ----------------------------------------------------

          else

            echo "======================================"
            echo "Creating STABLE release"
            echo "======================================"


            gh release create "$TAG" \
              HBStoreHub.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "HB Store Hub ${TAG}" \
              --notes "Stable release for all users." \
              --latest

          fi


          echo ""
          echo "======================================"
          echo "RELEASE COMPLETED"
          echo "======================================"
          echo "Tag: $TAG"
          echo "Type: $RELEASE_TYPE"
          echo "Version: $VERSION_NAME"
          echo "======================================"
