name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout repository
      # ==================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # 2. Find and extract Android ZIP
      # ==================================================
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Android project ZIP..."
          echo "======================================"

          ZIP="$(find . \
            -maxdepth 4 \
            -type f \
            -iname 'HBStoreHubAndroid*.zip' \
            -not -path './project/*' \
            | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo ""
            echo "ERROR: HBStoreHubAndroid ZIP not found."
            echo ""
            echo "Files found in repository:"
            find . -maxdepth 4 -type f | head -300
            exit 1
          fi

          echo ""
          echo "ZIP found:"
          echo "$ZIP"
          echo ""

          rm -rf project
          mkdir -p project

          echo "Extracting ZIP..."
          unzip -o "$ZIP" -d project

          echo ""
          echo "Searching for Gradle project..."

          SETTINGS="$(find project \
            -type f \
            \( \
              -name 'settings.gradle' \
              -o \
              -name 'settings.gradle.kts' \
            \) \
            | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo ""
            echo "Extracted files:"
            find project -maxdepth 7 -type f | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Android project directory:"
          echo "$PROJECT_DIR"
          echo ""

          ls -la "$PROJECT_DIR"


      # ==================================================
      # 3. Java 17
      # ==================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==================================================
      # 4. Android SDK
      # ==================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # ==================================================
      # 5. Gradle 8.9
      # ==================================================
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ==================================================
      # 6. Generate Gradle Wrapper
      # ==================================================
      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Generating Gradle wrapper..."

          gradle wrapper --gradle-version 8.9

          chmod +x gradlew

          echo "Gradle wrapper ready."


      # ==================================================
      # 7. Enable AndroidX
      # ==================================================
      - name: Enable AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          touch gradle.properties

          if ! grep -q "^android.useAndroidX=" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          fi

          echo ""
          echo "gradle.properties:"
          cat gradle.properties


      # ==================================================
      # 8. Set Android version
      # ==================================================
      - name: Set version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          VERSION_NAME="1.0.${VERSION_CODE}"

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo ""
          echo "Version Code : $VERSION_CODE"
          echo "Version Name : $VERSION_NAME"
          echo ""

          if [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."

            find . -maxdepth 5 -type f | head -300

            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("app/build.gradle")

          text = path.read_text()

          version_code = os.environ["VERSION_CODE"]
          version_name = os.environ["VERSION_NAME"]

          # versionCode
          text, count_code = re.subn(
              r'(\bversionCode\s+)\d+',
              rf'\g<1>{version_code}',
              text,
              count=1
          )

          # versionName
          text, count_name = re.subn(
              r'(\bversionName\s+)(["\']).*?\2',
              rf'\g<1>"{version_name}"',
              text,
              count=1
          )

          if count_code == 0:
              raise SystemExit(
                  "ERROR: versionCode not found in app/build.gradle"
              )

          if count_name == 0:
              raise SystemExit(
                  "ERROR: versionName not found in app/build.gradle"
              )

          path.write_text(text)

          print("Version updated successfully.")
          PY

          echo ""
          echo "Current version settings:"
          grep -nE "versionCode|versionName" app/build.gradle


      # ==================================================
      # 9. Restore existing signing key
      # ==================================================
      - name: Restore signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          echo "Checking signing key..."

          DEST="$PROJECT_DIR/app/release-key.jks"

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo ""
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo ""
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ ! -f "hbstore-key.jks" ]; then
            echo ""
            echo "ERROR: hbstore-key.jks not found in repository."
            echo ""
            echo "A new signing key will NOT be generated."
            echo "This protects existing app updates from signing-key mismatch."
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/app"

          cp "hbstore-key.jks" "$DEST"

          if [ ! -s "$DEST" ]; then
            echo ""
            echo "ERROR: release-key.jks is empty."
            exit 1
          fi

          echo ""
          echo "Existing signing key restored successfully."
          echo "Key location:"
          echo "$DEST"


      # ==================================================
      # 10. Build signed APK
      # ==================================================
      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "======================================"
          echo "Building signed release APK..."
          echo "======================================"

          ./gradlew clean assembleRelease --no-daemon --stacktrace

          echo ""
          echo "Build completed."


      # ==================================================
      # 11. Prepare APK
      # ==================================================
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR: app-release.apk not found."

            echo ""
            echo "Available output files:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              2>/dev/null || true

            exit 1
          fi

          cp "$APK" HBStoreHub.apk

          echo ""
          echo "======================================"
          echo "APK ready"
          echo "======================================"

          ls -lh HBStoreHub.apk


      # ==================================================
      # 12. Upload GitHub Actions artifact
      # ==================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HBStoreHub-APK
          path: HBStoreHub.apk
          if-no-files-found: error


      # ==================================================
      # 13. Create GitHub Release
      # ==================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_CODE }}
          name: HB Store Hub v${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: HBStoreHub.apk
