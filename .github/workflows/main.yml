 name: Android Release

on:
  push:
    tags:
      - 'v*-test'
      - 'v[0-9]*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (example: 69)'
        required: true
        type: string

      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - test
          - stable

      promote_tag:
        description: 'Leave empty. Only use this to promote an existing test release, example: v69-test'
        required: false
        type: string

permissions:
  contents: write

jobs:

  # ============================================================
  # PROMOTE EXISTING TEST RELEASE
  # ============================================================
  promote:
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.promote_tag != ''

    runs-on: ubuntu-latest

    steps:
      - name: Promote test release to stable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.promote_tag }}

        run: |
          echo "Promoting $TAG to stable..."

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease=false \
            --latest=true

          echo "Release promoted successfully."


  # ============================================================
  # BUILD + RELEASE
  # ============================================================
  build-release:
    if: >
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.promote_tag == ''
      )

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Java
      # --------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------------
      # Gradle
      # --------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # --------------------------------------------------------
      # Determine release information
      # --------------------------------------------------------
      - name: Determine version
        id: version
        shell: bash

        run: |

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then

            TAG="${GITHUB_REF_NAME}"

          else

            VERSION="${{ inputs.version }}"
            TYPE="${{ inputs.release_type }}"

            if [ "$TYPE" = "test" ]; then
              TAG="v${VERSION}-test"
            else
              TAG="v${VERSION}"
            fi

          fi


          CODE="${TAG#v}"
          CODE="${CODE%%-*}"


          if ! [[ "$CODE" =~ ^[0-9]+$ ]]; then
            echo "Invalid version/tag: $TAG"
            exit 1
          fi


          if [[ "$TAG" == *-test ]]; then
            TYPE="test"
          else
            TYPE="stable"
          fi


          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$CODE" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"


          echo "================================"
          echo "Tag:     $TAG"
          echo "Version: 1.0.$CODE"
          echo "Type:    $TYPE"
          echo "================================"


      # --------------------------------------------------------
      # Prepare signing key
      # --------------------------------------------------------
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

        run: |

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi


          mkdir -p app


          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks


      # --------------------------------------------------------
      # Build signed APK
      # --------------------------------------------------------
      - name: Build signed APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}

          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |

          gradle --no-daemon assembleRelease


      # --------------------------------------------------------
      # Verify APK
      # --------------------------------------------------------
      - name: Verify APK
        run: |

          test -f app/build/outputs/apk/release/app-release.apk


      # --------------------------------------------------------
      # Rename APK
      # --------------------------------------------------------
      - name: Rename APK
        run: |

          cp \
            app/build/outputs/apk/release/app-release.apk \
            HBStoreHub.apk


      # --------------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          TAG="${{ steps.version.outputs.tag }}"
          TYPE="${{ steps.version.outputs.type }}"


          if [ "$TYPE" = "test" ]; then

            echo "Creating TEST release..."

            gh release create "$TAG" HBStoreHub.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "HB Store Hub ${TAG} (TEST)" \
              --notes "Admin-only test release. Shops and storekeepers remain on the current stable version." \
              --prerelease


          else

            echo "Creating STABLE release..."

            gh release create "$TAG" HBStoreHub.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "HB Store Hub ${TAG}" \
              --notes "Stable release for all users." \
              --latest

          fi
