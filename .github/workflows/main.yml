name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          ZIP="$(ls -t $(find . -maxdepth 3 -iname 'HBStoreHubAndroid*.zip' -not -path './project/*') 2>/dev/null | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "HBStoreHubAndroid zip not found in repo"
            ls -R | head -100
            exit 1
          fi
          echo "Using: $ZIP"
          rm -rf project
          unzip -o "$ZIP" -d project
          SETTINGS="$(find project -maxdepth 3 -name settings.gradle | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found inside the zip"
            ls -R project | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          ls -la "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Enable AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          touch gradle.properties
          grep -q "android.useAndroidX" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -q "android.enableJetifier" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties
          cat gradle.properties

      - name: Set version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.$VERSION_CODE"
          sed -i -E "s/versionCode[ =]+[0-9]+/versionCode $VERSION_CODE/" app/build.gradle
          sed -i -E "s/versionName[ =]+'[^']+'/versionName '$VERSION_NAME'/" app/build.gradle
          sed -i -E "s/versionName[ =]+\"[^\"]+\"/versionName \"$VERSION_NAME\"/" app/build.gradle
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          grep -nE "versionCode|versionName" app/build.gradle

      - name: Restore or generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          DEST="$PROJECT_DIR/app/release-key.jks"
          if [ -f "hbstore-key.jks" ]; then
            echo "Existing HB Store keystore found - reusing it."
            cp hbstore-key.jks "$DEST"
          else
            echo "Generating new HB Store keystore (first time only)."
            keytool -genkeypair -v \
              -keystore "$DEST" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=HBStoreHub, OU=HBStoreHub, O=HBStoreHub, L=Kerala, S=Kerala, C=IN"
            cp "$DEST" hbstore-key.jks
          fi
          test -s "$DEST"
          echo "Keystore ready."

      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" HBStoreHub.apk
          ls -lh HBStoreHub.apk

      - name: Commit keystore to repo (only if newly generated)
        run: |
          if [ -n "$(git status --porcelain hbstore-key.jks)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add hbstore-key.jks
            git commit -m "Add HB Store release keystore (auto-generated)"
            git push
          else
            echo "Nothing to commit."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HBStoreHub-APK
          path: HBStoreHub.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_CODE }}
          name: HB Store Hub v${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: HBStoreHub.apk
