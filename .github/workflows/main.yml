name: Android Release

on:
  push:
    tags:
      - 'v*-test'
      - 'v[0-9]*'

  workflow_dispatch:
    inputs:
      promote_tag:
        description: 'Existing test tag to promote to the latest stable release (for example v69-test)'
        required: false
        type: string

permissions:
  contents: write

jobs:

  # ============================================================
  # PROMOTE A TEST RELEASE TO STABLE
  # ============================================================
  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_tag != ''
    runs-on: ubuntu-latest

    steps:
      - name: Promote test release to stable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.promote_tag }}

        run: |
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease=false \
            --latest=true


  # ============================================================
  # BUILD AND RELEASE APK
  # ============================================================
  build-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Java 17
      # --------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------------
      # Gradle
      # --------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # --------------------------------------------------------
      # Prepare Android signing key
      # --------------------------------------------------------
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 GitHub secret is required."
            exit 1
          fi

          mkdir -p app

          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks


      # --------------------------------------------------------
      # Calculate version from Git tag
      #
      # v69       -> versionCode 69
      # v69-test  -> versionCode 69
      #
      # versionName:
      # 1.0.69
      # --------------------------------------------------------
      - name: Calculate Android version
        id: version
        shell: bash

        run: |
          TAG="${GITHUB_REF_NAME}"

          CODE="${TAG#v}"
          CODE="${CODE%%-*}"

          if ! [[ "$CODE" =~ ^[0-9]+$ ]]; then
            echo "Tag must look like v69 or v69-test."
            echo "Received: $TAG"
            exit 1
          fi

          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$CODE" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Build signed APK
      # --------------------------------------------------------
      - name: Build signed APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}

          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |
          gradle --no-daemon assembleRelease


      # --------------------------------------------------------
      # Verify APK exists
      # --------------------------------------------------------
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk


      # --------------------------------------------------------
      # Rename APK
      # --------------------------------------------------------
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk HBStoreHub.apk


      # ========================================================
      # CREATE GITHUB RELEASE
      # ========================================================
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          TAG="${GITHUB_REF_NAME}"


          # ----------------------------------------------------
          # TEST RELEASE
          # ----------------------------------------------------
          if [[ "$TAG" == *-test ]]; then

            gh release create "$TAG" HBStoreHub.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "HB Store Hub ${TAG} (TEST)" \
              --notes "Admin test release. Shops and storekeepers continue using the latest stable release." \
              --prerelease


          # ----------------------------------------------------
          # STABLE RELEASE
          # ----------------------------------------------------
          else

            gh release create "$TAG" HBStoreHub.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "HB Store Hub ${TAG}" \
              --notes "Stable release for all users." \
              --latest

          fi
