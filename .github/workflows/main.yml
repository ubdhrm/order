name: Release Storekeeper APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-storekeeper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Storekeeper source
        uses: actions/checkout@v4

      - name: Find Android project
        run: |
          set -e

          SETTINGS="$(find . \
            -name settings.gradle \
            -o -name settings.gradle.kts | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "Android project not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Set version 1.0.99 / code 99
        run: |
          set -e

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "app/build.gradle not found."
            exit 1
          fi

          python3 - <<'PY'
          import os
          import re

          path = os.path.join(
              os.environ["PROJECT_DIR"],
              "app",
              "build.gradle"
          )

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode 99',
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName "1.0.99"',
              text,
              count=1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Version updated:")
          print("versionCode 99")
          print('versionName "1.0.99"')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Storekeeper release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gradle clean assembleRelease --no-daemon

      - name: Find APK
        run: |
          set -e

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "Storekeeper APK not found."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          cp "$APK" "Storekeeper-v1.0.99.apk"

          ls -lh "Storekeeper-v1.0.99.apk"

      - name: Checkout public update repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.UPDATE_REPO }}
          token: ${{ secrets.UPDATE_REPO_TOKEN }}
          path: public-update-repo

      - name: Publish Storekeeper APK
        run: |
          set -e

          cd public-update-repo

          mkdir -p storekeeper

          cp "../Storekeeper-v1.0.99.apk" \
             "storekeeper/Storekeeper.apk"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add storekeeper/Storekeeper.apk

          git commit -m "Release Storekeeper v1.0.99"

          git push

          echo "Storekeeper v1.0.99 published successfully."
