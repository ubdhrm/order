name: Build HB Store Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          ZIP="$(find . -maxdepth 3 -iname 'HBStoreHubAndroid*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Zip file not found in repo"
            ls -R | head -100
            exit 1
          fi
          echo "Using: $ZIP"
          unzip -o "$ZIP" -d project
          ls -la project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper
        working-directory: project/HBStoreHubAndroid_Final
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Enable AndroidX
        working-directory: project/HBStoreHubAndroid_Final
        run: |
          touch gradle.properties
          grep -q "android.useAndroidX" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -q "android.enableJetifier" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties

      - name: Build APK
        working-directory: project/HBStoreHubAndroid_Final
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HBStoreHub-APK
          path: project/HBStoreHubAndroid_Final/app/build/outputs/apk/debug/*.apk
