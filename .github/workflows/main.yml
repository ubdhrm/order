name: Release Storekeeper APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-storekeeper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Storekeeper source
        uses: actions/checkout@v4

      - name: Find Android project
        run: |
          set -e

          echo "Searching for Android project..."

          SETTINGS=$(find . -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -not -path "./.git/*" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            echo "Files in repository:"
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set version 1.0.99 / code 99
        run: |
          set -e

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          fi

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo "Using: $GRADLE_FILE"

          python3 - "$GRADLE_FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Groovy
          text = re.sub(
              r'versionCode\s*=?\s*\d+',
              'versionCode 99',
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s*=?\s*"[^"]+"',
              'versionName "1.0.99"',
              text,
              count=1
          )

          # Kotlin DSL
          text = re.sub(
              r'versionCode\s*=\s*\d+',
              'versionCode = 99',
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "1.0.99"',
              text,
              count=1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Version set to:")
          print("versionName = 1.0.99")
          print("versionCode = 99")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Storekeeper release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gradle clean assembleRelease --no-daemon

      - name: Find APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Storekeeper APK not found."
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          cp "$APK" "Storekeeper-v1.0.99.apk"

      - name: Checkout public update repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.UPDATE_REPO }}
          token: ${{ secrets.UPDATE_REPO_TOKEN }}
          path: public-update-repo

      - name: Publish Storekeeper APK
        run: |
          set -e

          cd public-update-repo

          mkdir -p storekeeper

          cp "../Storekeeper-v1.0.99.apk" \
             "storekeeper/Storekeeper.apk"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add storekeeper/Storekeeper.apk

          git commit -m "Release Storekeeper v1.0.99"

          git push

          echo "================================"
          echo "Storekeeper v1.0.99 released"
          echo "Version code: 99"
          echo "================================"                    
